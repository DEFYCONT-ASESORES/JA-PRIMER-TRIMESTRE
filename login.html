<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso · DEFYCONT Asesores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#050B1A; --navy-900:#0A1628; --navy-800:#0F2340;
  --navy-700:#15325C; --navy-600:#1E4785; --navy-500:#2B5FA8;
  --blue-500:#3B7BD4; --blue-400:#5B9BE8; --blue-300:#93BCEF;
  --teal-600:#0D7A6F; --teal-500:#14A89A; --teal-400:#2DD4BF;
  --gray-50:#F6F8FB; --gray-100:#EEF2F7; --gray-200:#DCE3ED;
  --gray-300:#B8C3D1; --gray-400:#8898AB; --gray-500:#5C6B7F;
  --gray-600:#3E4C60; --gray-700:#2A3544;
  --danger:#DC2626; --danger-bg:#FEF2F2;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{height:100%;}

body{
  font-family:'Manrope',-apple-system,sans-serif;
  background:var(--navy-900);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

/* Fondo animado */
.bg-orbs{
  position:fixed;inset:0;pointer-events:none;z-index:0;
}
.orb{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:0.18;
}
.orb-1{
  width:600px;height:600px;
  background:radial-gradient(circle,var(--blue-500),transparent 70%);
  top:-10%;left:-10%;
  animation:drift1 18s ease-in-out infinite alternate;
}
.orb-2{
  width:500px;height:500px;
  background:radial-gradient(circle,var(--teal-500),transparent 70%);
  bottom:-15%;right:-10%;
  animation:drift2 22s ease-in-out infinite alternate;
}
.orb-3{
  width:350px;height:350px;
  background:radial-gradient(circle,var(--navy-500),transparent 70%);
  top:50%;left:50%;transform:translate(-50%,-50%);
  animation:drift3 14s ease-in-out infinite alternate;
}
@keyframes drift1{to{transform:translate(40px,60px);}}
@keyframes drift2{to{transform:translate(-40px,-50px);}}
@keyframes drift3{to{transform:translate(-50%,-50%) scale(1.2);}}

/* Noise texture overlay */
.bg-noise{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:0.35;
}

/* ── Card ── */
.card{
  position:relative;z-index:10;
  width:100%;max-width:420px;
  margin:20px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:24px;
  padding:44px 40px 40px;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:
    0 32px 64px -16px rgba(5,11,26,0.7),
    0 0 0 1px rgba(255,255,255,0.06) inset,
    0 1px 0 rgba(255,255,255,0.12) inset;
  animation:cardIn 0.6s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(24px) scale(0.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* ── Logo ── */
.logo-wrap{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:32px;
  gap:14px;
}
.logo-img{
  width:100px;
  height:100px;
  border-radius:20px;
  object-fit:contain;
  background:white;
  padding:8px;
  box-shadow:
    0 12px 32px -8px rgba(5,11,26,0.5),
    0 0 0 1px rgba(255,255,255,0.15);
  transition:transform 0.3s;
}
.logo-img:hover{transform:scale(1.04);}

/* Fallback si la imagen no carga */
.logo-fallback{
  display:none;
  width:100px;height:100px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--blue-500),var(--teal-500));
  align-items:center;justify-content:center;
  font-weight:800;font-size:28px;color:white;
  letter-spacing:-0.04em;
  box-shadow:0 12px 32px -8px rgba(5,11,26,0.5);
}

.brand-name{
  font-size:13px;
  font-weight:700;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.55);
  text-align:center;
}

/* ── Headings ── */
.card-title{
  font-size:22px;
  font-weight:700;
  color:white;
  letter-spacing:-0.025em;
  text-align:center;
  margin-bottom:6px;
}
.card-sub{
  font-size:13px;
  color:rgba(255,255,255,0.40);
  text-align:center;
  margin-bottom:30px;
  line-height:1.5;
}

/* ── Form ── */
.field{margin-bottom:18px;}

.field label{
  display:block;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.45);
  margin-bottom:8px;
}

.input-wrap{position:relative;}
.input-wrap svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:rgba(255,255,255,0.28);pointer-events:none;
}

.field input{
  width:100%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  padding:13px 14px 13px 44px;
  font-family:'Manrope',sans-serif;
  font-size:14px;
  font-weight:500;
  color:white;
  outline:none;
  transition:border-color 0.2s,background 0.2s,box-shadow 0.2s;
  letter-spacing:0.01em;
}
.field input::placeholder{color:rgba(255,255,255,0.22);}
.field input:focus{
  border-color:var(--blue-400);
  background:rgba(59,123,212,0.08);
  box-shadow:0 0 0 3px rgba(59,123,212,0.18);
}
.field input:focus + .focus-ring,
.field input:focus ~ .focus-ring{display:block;}

/* Toggle contraseña */
.toggle-pass{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:4px;
  color:rgba(255,255,255,0.28);
  transition:color 0.2s;
  display:flex;align-items:center;
}
.toggle-pass:hover{color:rgba(255,255,255,0.7);}

/* ── Error ── */
.error-msg{
  display:none;
  background:rgba(220,38,38,0.12);
  border:1px solid rgba(220,38,38,0.35);
  border-radius:10px;
  padding:11px 14px;
  font-size:12.5px;
  font-weight:600;
  color:#FCA5A5;
  margin-bottom:18px;
  text-align:center;
  animation:shake 0.4s cubic-bezier(.36,.07,.19,.97);
}
.error-msg.visible{display:block;}
@keyframes shake{
  10%,90%{transform:translateX(-2px);}
  20%,80%{transform:translateX(3px);}
  30%,50%,70%{transform:translateX(-4px);}
  40%,60%{transform:translateX(4px);}
}

/* ── Botón ── */
.btn-login{
  width:100%;
  padding:15px;
  background:linear-gradient(135deg,var(--navy-600) 0%,var(--blue-500) 100%);
  border:none;
  border-radius:12px;
  color:white;
  font-family:'Manrope',sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:0.02em;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform 0.15s,box-shadow 0.2s,filter 0.2s;
  box-shadow:0 8px 24px -6px rgba(30,71,133,0.55);
}
.btn-login::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);
  opacity:0;transition:opacity 0.2s;
}
.btn-login:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 32px -6px rgba(30,71,133,0.65);
  filter:brightness(1.08);
}
.btn-login:hover::before{opacity:1;}
.btn-login:active{transform:translateY(0);filter:brightness(0.97);}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

/* Loading spinner dentro del botón */
.btn-loader{
  display:none;
  width:18px;height:18px;
  border:2.5px solid rgba(255,255,255,0.3);
  border-top-color:white;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Footer card ── */
.card-footer{
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,0.08);
  text-align:center;
  font-size:11px;
  color:rgba(255,255,255,0.22);
  letter-spacing:0.02em;
  line-height:1.6;
}

/* ── Divider de seguridad ── */
.security-badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;
  font-size:10.5px;
  color:rgba(255,255,255,0.28);
  font-weight:600;
  letter-spacing:0.06em;
}
.security-badge svg{flex-shrink:0;}

/* ── Responsive ── */
@media(max-width:480px){
  .card{padding:32px 24px 28px;margin:16px;}
  .card-title{font-size:19px;}
  .logo-img,.logo-fallback{width:80px;height:80px;}
}
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="bg-noise"></div>

<div class="card" role="main">

  <div class="logo-wrap">
    <img
      class="logo-img"
      src="https://drive.google.com/uc?export=view&id=1uvLxzigHwgYW_f5iifQp-NgFLgfRauot"
      alt="DEFYCONT Asesores"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';"
    >
    <div class="logo-fallback" aria-hidden="true">DC</div>
    <span class="brand-name">DEFYCONT Asesores</span>
  </div>

  <h1 class="card-title">Bienvenido</h1>
  <p class="card-sub">Ingresa tu contraseña para acceder al reporte Q1 2026</p>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
          <svg id="eyeOpen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="eyeClosed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg" role="alert">
      ✕ &nbsp;Contraseña incorrecta. Inténtalo de nuevo.
    </div>

    <button type="submit" class="btn-login" id="submitBtn">
      <span id="btnText">Ingresar al reporte</span>
      <div class="btn-loader" id="btnLoader"></div>
    </button>
  </form>

  <div class="card-footer">
    Balanza de Comprobación · Q1 2026<br>
    <span class="security-badge">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Acceso protegido · DEFYCONT Asesores
    </span>
  </div>

</div>

<script>
  // ── Contraseña ───────────────────────────────────────────
  const PASSWORD = '4491222020';
  // ─────────────────────────────────────────────────────────

  // Si ya está autenticado, redirigir directamente
  if(sessionStorage.getItem('dc_auth') === '1'){
    window.location.replace('index.html');
  }

  const form     = document.getElementById('loginForm');
  const errMsg   = document.getElementById('errorMsg');
  const submitBtn= document.getElementById('submitBtn');
  const btnText  = document.getElementById('btnText');
  const btnLoader= document.getElementById('btnLoader');
  const toggleBtn= document.getElementById('togglePass');
  const passInput= document.getElementById('password');
  const eyeOpen  = document.getElementById('eyeOpen');
  const eyeClosed= document.getElementById('eyeClosed');

  // Toggle mostrar/ocultar contraseña
  toggleBtn.addEventListener('click', function(){
    const showing = passInput.type === 'text';
    passInput.type = showing ? 'password' : 'text';
    eyeOpen.style.display  = showing ? '' : 'none';
    eyeClosed.style.display= showing ? 'none' : '';
    toggleBtn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
  });

  // Submit
  form.addEventListener('submit', function(e){
    e.preventDefault();
    errMsg.classList.remove('visible');

    const pass = document.getElementById('password').value;

    // Simular carga breve
    submitBtn.disabled = true;
    btnText.style.display = 'none';
    btnLoader.style.display = 'block';

    setTimeout(function(){
      btnLoader.style.display = 'none';
      btnText.style.display = '';
      submitBtn.disabled = false;

      if(pass === PASSWORD){
        sessionStorage.setItem('dc_auth','1');
        // Animación de salida
        document.querySelector('.card').style.animation = 'cardOut 0.35s cubic-bezier(.4,0,.2,1) both';
        setTimeout(function(){ window.location.replace('index.html'); }, 320);
      } else {
        errMsg.classList.remove('visible');
        void errMsg.offsetWidth; // Restart animation
        errMsg.classList.add('visible');
        passInput.value = '';
        passInput.focus();
      }
    }, 700);
  });

  // Limpiar error al escribir
  passInput.addEventListener('input', function(){ errMsg.classList.remove('visible'); });
</script>

<style>
@keyframes cardOut{
  to{opacity:0;transform:translateY(-16px) scale(0.97);}
}
</style>
</body>
</html>
